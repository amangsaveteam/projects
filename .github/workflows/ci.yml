name: Local Runner CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  WA_T_ARTIFACT_UPLOAD_BASE: http://10.51.33.211:10000/chfs/shared/ros2_modules/Middlware/WA_T/2.0.0

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Runner hostname:"
          hostname

          echo "Current branch:"
          echo "$GITHUB_REF_NAME"

          echo "Current commit:"
          git rev-parse HEAD

          echo "Runner working!"

      - name: Architecture guard
        run: python3 system_deployment/architecture/check_architecture.py

      - name: Python syntax check
        run: python3 -m py_compile system_deployment/build/package_firmware.py

      - name: Dry-run regular package
        run: bash system_deployment/build/build_release.sh --dry-run

      - name: Dry-run WA-T package
        run: bash system_deployment/build/build_special_wa_t_jk2_v1_package.sh --dry-run

      - name: Build regular package
        if: github.event_name != 'pull_request'
        run: bash system_deployment/build/build_release.sh

      - name: Build WA-T package
        if: github.event_name != 'pull_request'
        run: bash system_deployment/build/build_special_wa_t_jk2_v1_package.sh

      - name: List package artifacts
        if: github.event_name != 'pull_request'
        run: ls -lh dist/*.run

      - name: Publish WA-T package to internal artifact server
        if: github.event_name != 'pull_request'
        env:
          ARTIFACT_SERVER_USERNAME: ${{ secrets.ARTIFACT_SERVER_USERNAME }}
          ARTIFACT_SERVER_PASSWORD: ${{ secrets.ARTIFACT_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*wa_t*.run)
          if (( ${#artifacts[@]} == 0 )); then
            echo 'No WA-T .run artifact found under dist/' >&2
            exit 1
          fi
          auth_args=()
          if [[ -n "${ARTIFACT_SERVER_USERNAME:-}" ]]; then
            auth_args+=(--user "${ARTIFACT_SERVER_USERNAME}:${ARTIFACT_SERVER_PASSWORD:-}")
          fi
          for artifact in "${artifacts[@]}"; do
            echo "Uploading ${artifact}"
            curl --fail --show-error --location --retry 3 \
              "${auth_args[@]}" \
              --upload-file "$artifact" \
              "${WA_T_ARTIFACT_UPLOAD_BASE}/$(basename "$artifact")"
          done

      - name: Upload package artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: middleware-installers-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*.run
          if-no-files-found: error
          retention-days: 14
