name: Local Runner CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: middleware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WA_T_ARTIFACT_UPLOAD_BASE: http://10.51.33.211:10000/chfs/shared/ros2_modules/Middlware/WA_T/2.0.0
  CHFS_BASE_URL: http://10.51.33.211:10000/chfs

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Runner hostname:"
          hostname

          echo "Current branch:"
          echo "$GITHUB_REF_NAME"

          echo "Current commit:"
          git rev-parse HEAD

          echo "Runner working!"

      - name: Architecture guard
        run: python3 system_deployment/architecture/check_architecture.py

      - name: Python syntax check
        run: python3 -m py_compile system_deployment/build/package_firmware.py

      - name: Dry-run WA-T package
        run: bash system_deployment/build/build_special_wa_t_jk2_v1_package.sh --dry-run

      - name: Build WA-T package
        if: github.event_name != 'pull_request'
        run: bash system_deployment/build/build_special_wa_t_jk2_v1_package.sh

      - name: List package artifacts
        if: github.event_name != 'pull_request'
        run: ls -lh dist/*.run

      - name: Publish WA-T package to internal artifact server
        if: github.event_name != 'pull_request'
        env:
          ARTIFACT_SERVER_USERNAME: ${{ secrets.ARTIFACT_SERVER_USERNAME }}
          ARTIFACT_SERVER_PASSWORD: ${{ secrets.ARTIFACT_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*wa_t*.run)
          (( ${#artifacts[@]} > 0 )) || { echo 'No WA-T .run artifact found' >&2; exit 1; }
          cookie_jar="$(mktemp)"
          trap 'rm -f "$cookie_jar"' EXIT
          upload_folder="${WA_T_ARTIFACT_UPLOAD_BASE#"${CHFS_BASE_URL}/shared"}"
          curl --fail --show-error --location --retry 3 --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            --data-urlencode "user=${ARTIFACT_SERVER_USERNAME:-}" --data-urlencode "pwd=${ARTIFACT_SERVER_PASSWORD:-}" \
            "${CHFS_BASE_URL}/session" >/dev/null
          for artifact in "${artifacts[@]}"; do
            curl --fail --show-error --location --retry 3 --cookie "$cookie_jar" \
              --form-string "folder=$upload_folder" --form "file=@${artifact};filename=$(basename "$artifact")" \
              "${CHFS_BASE_URL}/upload"
          done

      - name: Upload package artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: middleware-installers-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/*.run
          if-no-files-found: error
          retention-days: 14
