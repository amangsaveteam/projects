name: Local Runner CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Runner hostname:"
          hostname

          echo "Current branch:"
          echo "$GITHUB_REF_NAME"

          echo "Current commit:"
          git rev-parse HEAD

          echo "Runner working!"