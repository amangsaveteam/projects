name: Local Runner CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: middleware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WA_T_ARTIFACT_UPLOAD_BASE: http://10.51.33.211:10000/chfs/shared/ros2_modules/Middlware/WA_T/2.0.0
  CHFS_BASE_URL: http://10.51.33.211:10000/chfs

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Runner hostname:"
          hostname

          echo "Current branch:"
          echo "$GITHUB_REF_NAME"

          echo "Current commit:"
          git rev-parse HEAD

          echo "Runner working!"

      - name: Architecture guard
        run: python3 system_deployment/architecture/check_architecture.py

      - name: Python syntax check
        run: python3 -m py_compile system_deployment/build/package_firmware.py

      - name: Test CHFS WA-T upload path
        if: github.event_name != 'pull_request'
        env:
          ARTIFACT_SERVER_USERNAME: ${{ secrets.ARTIFACT_SERVER_USERNAME }}
          ARTIFACT_SERVER_PASSWORD: ${{ secrets.ARTIFACT_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          smoke_file="$(mktemp --suffix=.ci-smoke)"
          cookie_jar="$(mktemp)"
          trap 'rm -f "$smoke_file" "$cookie_jar"' EXIT
          printf 'middleware-ci smoke test %s\n' "$GITHUB_RUN_ID" > "$smoke_file"
          upload_folder="${WA_T_ARTIFACT_UPLOAD_BASE#"${CHFS_BASE_URL}/shared"}"
          curl --fail --show-error --location --retry 3 \
            --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            --data-urlencode "user=${ARTIFACT_SERVER_USERNAME:-}" \
            --data-urlencode "pwd=${ARTIFACT_SERVER_PASSWORD:-}" \
            "${CHFS_BASE_URL}/session" >/dev/null
          curl --fail --show-error --location --retry 3 --cookie "$cookie_jar" \
            --form-string "folder=$upload_folder" \
            --form "file=@${smoke_file};filename=.middleware-ci-${GITHUB_RUN_ID}.smoke" \
            "${CHFS_BASE_URL}/upload" >/dev/null
          curl --fail --silent --show-error --retry 3 --cookie "$cookie_jar" \
            --get --data-urlencode "filepath=$upload_folder" "${CHFS_BASE_URL}/files" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(f.get("name")==sys.argv[1] for f in d.get("files",[])), d' ".middleware-ci-${GITHUB_RUN_ID}.smoke"
          curl --fail --show-error --retry 3 --cookie "$cookie_jar" \
            --data-urlencode "filepath=$upload_folder/.middleware-ci-${GITHUB_RUN_ID}.smoke" \
            "${CHFS_BASE_URL}/rmfiles" >/dev/null
          echo "CHFS path verified: $upload_folder"
