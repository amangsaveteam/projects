event:
  name: 低电量告警

  enabled: true

  rule:
    field: battery_level
    op: less_than
    value: 0.3
    for_seconds: 0

  alarm:
    major_code: "30"
    minor_code: "002"
    name: "低电量告警"
    severity: 3
    description: "电池电量低，请充电"
    recovery: "建议尽快连接充电桩进行充电"
    use_tts: false
    audio_path: ""
