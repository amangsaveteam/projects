model: ZYD_V2
alias: [ZYD_V1]
version: 'V1.0'

scripts:
    - name: wristRollLimitByPitch
      content: |
        function wristRollLimitByPitch(wristPitch)
            local absPitch = math.abs(wristPitch)

            if absPitch <= 17.0000 then
                return { min = -87.0000, max = 87.0000 }
            end

            if absPitch < 57.0000 then
                local maxRoll = 87.0000 - (absPitch - 17.0000) * 52.0000 / 40.0000
                return { min = -maxRoll, max = maxRoll }
            end

            return { min = -35.0000, max = 35.0000 }
        end
    - name: wristPitchLimitByRoll
      content: |
        function wristPitchLimitByRoll(wristRoll)
            local absRoll = math.abs(wristRoll)

            if absRoll <= 35.0000 then
                return { min = -57.0000, max = 57.0000 }
            end

            if absRoll < 87.0000 then
                local maxPitch = 57.0000 - (absRoll - 35.0000) * 40.0000 / 52.0000
                return { min = -maxPitch, max = maxPitch }
            end

            return { min = -17.0000, max = 17.0000 }
        end

