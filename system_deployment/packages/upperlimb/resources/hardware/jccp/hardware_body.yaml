model: JCCP
version: 'V1.0'

scripts:
    - name: neckPitchLimitByYaw
      content: |
        function neckPitchLimitByYaw(neckYaw)
            if neckYaw < -42.0000 or neckYaw > 42.0000 then
                return { min = -9.7000, max = 19.0000 }
            end

            local absYaw = math.abs(neckYaw)
            if absYaw <= 10.0000 then
                return { min = -9.7000, max = 34.7000 }
            end

            if absYaw < 15.0000 then
                local maxPitch = 34.7000 - (absYaw - 10.0000) * 10.7000 / 5.0000
                return { min = -9.7000, max = maxPitch }
            end

            local maxPitch = 24.0000 - (absYaw - 15.0000) / 5.4000
            return { min = -9.7000, max = maxPitch }
        end
    - name: neckYawLimitByPitch
      content: |
        function neckYawLimitByPitch(neckPitch)
            if neckPitch < -9.7000 then
                return { min = -42.0000, max = 42.0000 }
            end

            if neckPitch > 34.7000 then
                return { min = -10.0000, max = 10.0000 }
            end

            if neckPitch <= 19.0000 then
                return { min = -42.0000, max = 42.0000 }
            end

            if neckPitch < 24.0000 then
                local yawMax = 42.0000 - (neckPitch - 19.0000) * 5.4000
                return { min = -yawMax, max = yawMax }
            end
            
            local yawMax = 15.0000 - (neckPitch - 24.0000) * 5.0000 / 10.7000
            return { min = -yawMax, max = yawMax }
        end

